<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mera Pehla Webpage</title>
    <style>
        /* Yahan se CSS shuru hoti hai (Design ke liye) */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f8ff; /* Halka neela background */
            color: #333;
            text-align: center;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #ff6b6b; /* Laal/Pink color ka header */
            color: white;
            padding: 30px 0;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .container {
            margin: 50px auto;
            padding: 30px;
            max-width: 600px;
            background: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            border-radius: 10px;
        }
        h1 {
            margin: 0;
            font-size: 36px;
        }
        p {
            line-height: 1.6;
            font-size: 18px;
        }
        .btn {
            background-color: #4CAF50; /* Hara button */
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
            transition: 0.3s;
        }
        .btn:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <header>
        <h1>Swagat Hai! 🚀</h1>
    </header>

    <!-- Main Content Section -->
    <div class="container">
        <h2>Mera Pehla HTML Page</h2>
        <p>Yeh ek simple HTML, CSS aur JavaScript ka example hai. Aap isme apne hisaab se changes kar sakte hain.</p>
        <p>Aap is code mein nayi images, links ya apni marzi ka text add kar sakte hain.</p>
        
        <!-- Button with simple JavaScript -->
        <button class="btn" onclick="alert('Wah! Aapne button click kar diya. Badhai ho! 🎉')">Mujhe Click Karein!</button>
    </div>

</body>
</html>
