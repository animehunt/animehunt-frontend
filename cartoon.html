<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cartoon – AnimeHunt</title>
  <link rel="stylesheet" href="style.css">

  <style>
    /* ===================================================
    GLOBAL RESET & BASE
    =================================================== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      overflow-x: hidden;
    }

    /* ===================================================
    HEADER
    =================================================== */
    .main-header {
      position: sticky;
      top: 0;
      z-index: 1000;
      height: 55px;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(8px);
      transition: box-shadow 0.3s ease;
    }

    .main-header.scrolled {
      box-shadow: 0 6px 18px rgba(0,0,0,0.6);
    }

    .menu-btn {
      font-size: 22px;
      cursor: pointer;
      transition: transform 0.25s ease;
    }

    .menu-btn:active {
      transform: scale(0.9);
    }

    .logo {
      font-size: 18px;
      font-weight: bold;
      white-space: nowrap;
    }

    .logo .anime {
      color: #ffffff;
    }

    .logo .hunt {
      color: #ffcc00;
    }

    .search-bar {
      margin-left: auto;
      width: 60%;
      height: 32px;
      border-radius: 25px;
      border: none;
      padding: 0 14px;
      font-size: 12px;
      background: #1a1f2e;
      color: #ccc;
      outline: none;
      transition: box-shadow 0.3s ease, transform 0.3s ease;
    }

    .search-bar:focus {
      box-shadow: 0 0 0 2px rgba(255,204,0,0.4);
      transform: scale(1.02);
    }

    /* ===================================================
    SIDEBAR
    =================================================== */
    .sidebar {
      position: fixed;
      top: 0;
      left: -260px;
      width: 260px;
      height: 100%;
      background: #11162a;
      z-index: 2000;
      padding: 20px;
      transition: left 0.35s cubic-bezier(0.2,0.8,0.2,1);
    }

    .sidebar.active {
      left: 0;
    }

    .close-btn {
      font-size: 22px;
      cursor: pointer;
      margin-bottom: 20px;
    }

    .sidebar-menu a {
      display: block;
      padding: 12px 0;
      color: #fff;
      text-decoration: none;
      transition: transform 0.25s ease, color 0.25s ease;
    }

    .sidebar-menu a:hover {
      transform: translateX(6px);
      color: #ffcc00;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(6px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 1500;
    }

    .overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    /* ===================================================
    CATEGORY BAR & CARDS BASE
    =================================================== */
    .category-bar {
      display: flex;
      gap: 10px;
      padding: 14px 16px;
      overflow-x: auto;
    }

    .movie-card {
      min-width: 22%;
      aspect-ratio: 2 / 3;
      background: #1a1f2e;
      border-radius: 10px;
      display: flex;
      align-items: flex-end;
      padding: 8px;
      font-size: 12px;
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease, filter 0.3s ease;
    }

    .movie-card:hover {
      transform: translateY(-6px) scale(1.05) rotateZ(1deg);
      box-shadow: 0 18px 40px rgba(0,0,0,0.7);
    }

    /* ===================================================
    A–Z NAV
    =================================================== */
    .az-nav {
      padding: 10px 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }

    .az-nav span {
      font-size: 12px;
      cursor: pointer;
      color: #ccc;
      transition: transform 0.2s ease, color 0.2s ease;
    }

    .az-nav span:hover {
      transform: scale(1.2);
      color: #ffcc00;
    }

    /* ===================================================
    FOOTER & BOTTOM NAV
    =================================================== */
    .main-footer {
      padding: 20px 16px 80px;
      background: #000;
      text-align: center;
    }

    .footer-links {
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .footer-links a {
      color: #ccc;
      font-size: 12px;
      text-decoration: none;
    }

    .footer-links a:hover {
      color: #ffcc00;
    }

    .copyright {
      font-size: 11px;
      color: #777;
    }

    /* BOTTOM NAV — now defined in style.css only */

    /* ===================================================
       SCROLLBAR REMOVAL & RENDERING FIXES
    =================================================== */
    *::-webkit-scrollbar {
      height: 0 !important;
      width: 0 !important;
      display: none !important;
    }

    section, div {
      border: 0 !important;
      outline: 0 !important;
    }

    /* ===================================================
    CARTOON PAGE SPECIFIC STYLES (FROM CARTOON.CSS)
    =================================================== */
    .page-banner {
      height: 220px;
      display: flex;
      align-items: flex-end;
      padding: 20px 16px;
      margin-bottom: 16px;
      background:
        linear-gradient(to bottom, rgba(0,0,0,0.05), rgba(0,0,0,0.12)),
        url("images/cartoon-banner.jpg") center/cover no-repeat;
    }

    .type-filter {
      display: flex;
      gap: 10px;
      padding: 0 16px 16px;
    }

    .type-filter button {
      height: 30px;
      padding: 0 14px;
      border-radius: 20px;
      border: 1px solid #555;
      background: transparent;
      color: #fff;
      font-size: 12px;
      cursor: pointer;
      transition: all .2s ease;
    }

    .type-filter button:hover {
      border-color: #ffcc00;
      color: #ffcc00;
    }

    .type-filter .active {
      background: #ffcc00;
      color: #000;
      border-color: #ffcc00;
    }

    .grid-wrap {
      padding: 0 16px 20px;
    }

    .cartoon-grid {
      display: grid;
      gap: 8px;
      animation: fadeUp .4s ease both;
    }

    .pagination {
      display: flex;
      justify-content: center;
      gap: 8px;
      padding: 20px 0 80px;
    }

    .pagination button {
      min-width: 32px;
      height: 32px;
      border-radius: 6px;
      border: 1px solid #444;
      background: transparent;
      color: #fff;
      font-size: 12px;
      cursor: pointer;
      transition: all .2s ease;
    }

    .pagination button:hover {
      border-color: #ffcc00;
      color: #ffcc00;
    }

    .pagination .active {
      background: #ffcc00;
      color: #000;
      border-color: #ffcc00;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
