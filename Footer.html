<head>
<style>
/* footer css */
.wolf-footer{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    height:90px;
    background:#020c25;
    display:flex;
    justify-content:space-around;
    align-items:center;
    z-index:99999;
    border-top:1px solid rgba(255,255,255,.08);
}

.nav-item{
    flex:1;
    text-align:center;
    color:#fff;
    text-decoration:none;
    position:relative;
}

.nav-item img{
    width:28px;
    height:28px;
    margin-bottom:6px;
}

.nav-item span{
    display:block;
    font-size:12px;
}

.nav-item.active span{
    color:#f4c21a;
}

.nav-item.active::after{
    content:'';
    position:absolute;
    bottom:-14px;
    left:50%;
    transform:translateX(-50%);
    width:90px;
    height:4px;
    background:#f4c21a;
    border-radius:50px;
}

.home.active img{
    width:70px;
    height:70px;
    filter:drop-shadow(0 0 12px #f4c21a);
}
</style>
</head>

<body>

<!-- page content -->

<footer class="wolf-footer">
    <a href="movies.html" class="nav-item" data-page="movies">
        <img src="assets/icons/movies.svg">
        <span>MOVIES</span>
    </a>

    <a href="series.html" class="nav-item" data-page="series">
        <img src="assets/icons/series.svg">
        <span>SERIES</span>
    </a>

    <a href="index.html" class="nav-item home" data-page="home">
        <img src="assets/icons/wolf.svg">
        <span>HOME</span>
    </a>

    <a href="anime.html" class="nav-item" data-page="anime">
        <img src="assets/icons/anime.svg">
        <span>ANIME</span>
    </a>

    <a href="cartoon.html" class="nav-item" data-page="cartoon">
        <img src="assets/icons/cartoon.svg">
        <span>CARTOON</span>
    </a>
</footer>

</body>
