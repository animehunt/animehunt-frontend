<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Secure Link Generator – AnimeHunt</title>
<style>
  :root {
    --bg-color: #0b0f1a;
    --card-bg: #111827;
    --border-color: #1f2937;
    --text-main: #f3f4f6;
    --text-muted: #9ca3af;
    --accent-green: #10b981;
    --accent-green-hover: #059669;
    --warning-bg: rgba(245, 158, 11, 0.1);
    --warning-border: rgba(245, 158, 11, 0.3);
    --warning-text: #fcd34d;
    --glow-color: rgba(16, 185, 129, 0.4);
    --purple-glow: #bd00ff;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }

  body {
    background: var(--bg-color);
    color: var(--text-main);
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
  }

  .header { margin-top: 30px; margin-bottom: 20px; }
  .brand { font-size: 24px; font-weight: 800; }
  .brand b { color: #ffcc00; }

  .card {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 16px;
    width: 90%;
    max-width: 420px;
    padding: 32px 24px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    text-align: center;
    position: relative;
    overflow: hidden;
  }

  /* Animated Top Border */
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, transparent, var(--purple-glow), transparent);
    animation: scanLine 2s linear infinite;
  }

  @keyframes scanLine {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
  }

  .step-indicator {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 30px;
    font-weight: 700;
  }

  .dots { display: flex; gap: 6px; }
  .dot { width: 14px; height: 6px; border-radius: 4px; background: #374151; transition: 0.3s; }
  .dot.active { background: var(--accent-green); box-shadow: 0 0 8px var(--accent-green); }

  .icon-wrap {
    width: 70px; height: 70px;
    border-radius: 50%;
    background: #1f2937;
    border: 1px solid #374151;
    display: flex; align-items: center; justify-content: center;
    font-size: 32px;
    margin: 0 auto 20px;
    box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
  }

  .title { font-size: 22px; font-weight: 800; margin-bottom: 12px; }
  .subtitle { font-size: 13px; color: var(--text-muted); margin-bottom: 24px; line-height: 1.5; }

  .warning-box {
    background: var(--warning-bg);
    border: 1px solid var(--warning-border);
    color: var(--warning-text);
    padding: 14px;
    border-radius: 8px;
    font-size: 12px;
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    gap: 10px;
    text-align: left;
  }

  .btn {
    width: 100%;
    padding: 16px;
    border-radius: 12px;
    border: none;
    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
    transition: all 0.3s;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .btn:disabled {
    background: #1f2937;
    color: #6b7280;
    cursor: not-allowed;
  }

  .btn.active {
    background: var(--accent-green);
    color: #000;
    box-shadow: 0 0 20px var(--glow-color);
  }

  .btn.active:hover {
    background: var(--accent-green-hover);
    transform: translateY(-2px);
  }

  .footer-text {
    margin-top: 30px;
    font-size: 13px;
    color: #555;
    font-weight: 600;
  }

  .loader {
    border: 3px solid rgba(255,255,255,0.1);
    border-top: 3px solid var(--text-main);
    border-radius: 50%;
    width: 18px;
    height: 18px;
    animation: spin 1s linear infinite;
    display: inline-block;
    vertical-align: middle;
    margin-right: 8px;
  }

  @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

  .error-msg {
    color: #ef4444; font-size: 14px; margin-bottom: 20px;
  }
</style>
</head>
<body>

<div class="header">
  <div class="brand"><span>Anime</span><b>Hunt</b></div>
</div>

<div class="card" id="mainCard">
  
  <!-- Step Indicator -->
  <div class="step-indicator">
    <span id="stepText">SECURITY SCAN 1 OF 3</span>
    <div class="dots">
      <div class="dot active" id="dot1"></div>
      <div class="dot" id="dot2"></div>
      <div class="dot" id="dot3"></div>
    </div>
  </div>

  <!-- Dynamic Content -->
  <div id="cardContent">
    <div class="icon-wrap" id="iconWrap">🛡️</div>
    <div class="title" id="mainTitle">Scanning Link Safety...</div>
    <div class="subtitle" id="subTitle">Checking destination domain integrity and security certificates.</div>
    
    <div class="warning-box">
      <span style="font-size: 16px;">⚠️</span>
      <span>Please minimize / ignore any pop-up ads and press button below.</span>
    </div>

    <button class="btn" id="actionBtn" disabled>
      <div class="loader"></div> Scanning Link...
    </button>
  </div>

</div>

<div class="footer-text">
  Thanks for visiting AnimeHunt ✨
</div>

<script type="module">
  // ============================================================
  // js/features/go.js (Embedded securely in module scope)
  // Dynamic Ad Integration & 3-Step Fake Loading
  // ============================================================

  let sessionData = null;
  const TIMER_SECONDS = 4; // Har step par 4 seconds ka wait time

  async function init() {
    const urlParams = new URLSearchParams(window.location.search);
    const sessionId = urlParams.get('session');

    if (!sessionId) {
      showError("Invalid Session ID. Please go back and try again.");
      return;
    }

    try {
      const res = await fetch(`/api/session/${sessionId}`);
      const json = await res.json();

      if (!json.success) {
        showError(json.message || "Session expired or invalid.");
        return;
      }

      sessionData = json.data;

      // Agar backend ne popup bheja hai, toh inject karo (First Ad Injection)
      if (sessionData.popup_script) {
        injectAdScript(sessionData.popup_script);
      }

      startStep1();

    } catch (err) {
      showError("Failed to connect to secure server.");
    }
  }

  // =========================================
  // STEP 1: SCANNING
  // =========================================
  function startStep1() {
    let timeLeft = TIMER_SECONDS;
    const btn = document.getElementById('actionBtn');

    const interval = setInterval(() => {
      timeLeft--;
      if (timeLeft <= 0) {
        clearInterval(interval);
        btn.disabled = false;
        btn.classList.add('active');
        btn.innerHTML = 'Continue to Link Generation ➔';
        
        // Add click listener dynamically
        btn.onclick = () => {
          btn.onclick = null; // Prevent double clicks
          handleStep1Click();
        };
      }
    }, 1000);
  }

  function handleStep1Click() {
    // Agar second ad script backend se aayi hai, usko is click par inject karo
    if (sessionData.verify_popup_script) {
      injectAdScript(sessionData.verify_popup_script);
    }
    startStep2();
  }

  // =========================================
  // STEP 2: GENERATING LINK
  // =========================================
  function startStep2() {
    // Update UI for Step 2
    document.getElementById('stepText').textContent = 'LINK GENERATION 2 OF 3';
    document.getElementById('dot2').classList.add('active');
    document.getElementById('iconWrap').innerHTML = '🔗';
    document.getElementById('mainTitle').textContent = 'Generating Secure Link...';
    document.getElementById('subTitle').textContent = 'Allocating high-speed server node for your file.';
    
    const btn = document.getElementById('actionBtn');
    btn.disabled = true;
    btn.classList.remove('active');
    btn.innerHTML = '<div class="loader"></div> Preparing Link...';

    let timeLeft = TIMER_SECONDS;
    
    const interval = setInterval(() => {
      timeLeft--;
      if (timeLeft <= 0) {
        clearInterval(interval);
        btn.disabled = false;
        btn.classList.add('active');
        btn.innerHTML = 'Get Secure Link ➔';
        
        btn.onclick = () => {
          btn.onclick = null;
          handleStep2Click();
        };
      }
    }, 1000);
  }

  // =========================================
  // STEP 3: REDIRECT TO DESTINATION
  // =========================================
  function handleStep2Click() {
    document.getElementById('stepText').textContent = 'REDIRECTING 3 OF 3';
    document.getElementById('dot3').classList.add('active');
    
    const btn = document.getElementById('actionBtn');
    btn.disabled = true;
    btn.classList.remove('active');
    btn.innerHTML = '<div class="loader"></div> Redirecting...';

    let finalUrl = sessionData.final_link;
    
    // Priority: Shortlink > Redirect Chain > Final Direct Link
    if (sessionData.shortlink_url) {
        finalUrl = sessionData.shortlink_url;
    } else if (sessionData.verify_redirect_url) {
        finalUrl = sessionData.verify_redirect_url;
    }

    if (finalUrl) {
      // Security Check: Make sure it's a valid http/https URL
      if (/^https?:\/\//i.test(finalUrl)) {
         setTimeout(() => { window.location.href = finalUrl; }, 1000);
      } else {
         showError("Malicious URL detected. Blocked for safety.");
      }
    } else {
      showError("Destination link not found.");
    }
  }

  // =========================================
  // AD SCRIPT INJECTOR
  // =========================================
  function injectAdScript(scriptStr) {
    if (!scriptStr) return;
    try {
      const scriptEl = document.createElement('script');
      // Agar backend se poora <script src="..."> tag aaya hai
      const srcMatch = scriptStr.match(/src=["'](.*?)["']/);
      if (srcMatch && srcMatch[1]) {
        scriptEl.src = srcMatch[1];
      } else {
        // Agar inline JS code aaya hai
        scriptEl.innerHTML = scriptStr.replace(/<\/?script[^>]*>/gi, '');
      }
      document.body.appendChild(scriptEl);
    } catch (e) {
      console.warn("Monetization script failed to load.", e);
    }
  }

  // =========================================
  // ERROR HANDLER
  // =========================================
  function showError(msg) {
    const content = document.getElementById('cardContent');
    content.innerHTML = `
      <div class="icon-wrap" style="color: #ef4444; font-size:40px;">⚠️</div>
      <div class="title" style="color: #ef4444;">Error</div>
      <div class="error-msg">${msg}</div>
      <button class="btn active" onclick="window.history.back()">Go Back</button>
    `;
  }

  // Run the sequence
  init();
</script>

</body>
</html>
