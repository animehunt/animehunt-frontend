<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Download — KnightWolf</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}

body {
  background: #060a14;
  color: #fff;
  font-family: system-ui, sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
  position: relative;
  overflow-x: hidden;
}

/* Animated background glow */
body::before {
  content: '';
  position: fixed;
  top: -120px;
  left: 50%;
  transform: translateX(-50%);
  width: 500px;
  height: 300px;
  background: radial-gradient(ellipse, rgba(255,204,0,0.07) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}

/* Logo */
.logo {
  font-size: 22px;
  font-weight: 900;
  margin-bottom: 24px;
  text-align: center;
  letter-spacing: -0.5px;
  position: relative;
  z-index: 1;
}
.logo span { color: #ccd; }
.logo b { color: #ffcc00; }
.logo-sub {
  font-size: 10px;
  color: #334;
  font-weight: 600;
  letter-spacing: 2px;
  text-transform: uppercase;
  text-align: center;
  margin-top: -18px;
  margin-bottom: 22px;
  position: relative;
  z-index: 1;
}

/* Card */
.card {
  background: linear-gradient(160deg, #0d1322 0%, #0a0f1e 100%);
  border: 1px solid #1a2540;
  border-radius: 22px;
  padding: 0;
  max-width: 420px;
  width: 100%;
  overflow: hidden;
  position: relative;
  z-index: 1;
  box-shadow: 0 24px 60px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,204,0,0.04);
}

/* Card top accent line */
.card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, #ffcc00, transparent);
  opacity: 0.6;
}

/* Header inside card */
.card-header {
  padding: 22px 22px 16px;
  text-align: center;
  border-bottom: 1px solid #111d30;
  background: rgba(255,204,0,0.02);
}
.episode-tag {
  display: inline-block;
  background: rgba(255,204,0,0.1);
  border: 1px solid rgba(255,204,0,0.2);
  border-radius: 20px;
  padding: 4px 12px;
  font-size: 10px;
  font-weight: 700;
  color: #ffcc00;
  margin-bottom: 10px;
  letter-spacing: 0.5px;
  text-transform: uppercase;
}
.host-name {
  font-size: 19px;
  font-weight: 800;
  margin-bottom: 5px;
  letter-spacing: -0.3px;
}
.host-meta {
  font-size: 11px;
  color: #445;
  font-weight: 500;
}

/* Quality section */
.quality-wrap {
  padding: 18px 18px 20px;
}
.section-title {
  font-size: 10px;
  color: #445;
  text-transform: uppercase;
  letter-spacing: 1px;
  font-weight: 700;
  margin-bottom: 12px;
  padding-left: 2px;
}

.quality-grid {
  display: flex;
  flex-direction: column;
  gap: 9px;
  margin-bottom: 16px;
}

/* Quality buttons */
.quality-btn {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 13px 16px;
  background: #080d1a;
  border: 1.5px solid #1a2540;
  border-radius: 13px;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  color: #fff;
  transition: all 0.22s cubic-bezier(0.2,0.8,0.2,1);
  text-decoration: none;
  position: relative;
  overflow: hidden;
}
.quality-btn::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, rgba(255,204,0,0.04), transparent);
  opacity: 0;
  transition: opacity 0.2s;
}
.quality-btn:hover {
  border-color: #ffcc00;
  transform: translateX(5px);
  box-shadow: -4px 0 16px rgba(255,204,0,0.12);
}
.quality-btn:hover::before { opacity: 1; }
.quality-btn:active { transform: translateX(2px) scale(0.99); }

.q-left { display: flex; align-items: center; gap: 11px; position: relative; }
.q-badge {
  width: 36px;
  height: 36px;
  border-radius: 9px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  flex-shrink: 0;
}
.q-text { display: flex; flex-direction: column; gap: 2px; }
.q-label { font-size: 13px; font-weight: 800; line-height: 1; }
.q-note  { font-size: 10px; color: #445; font-weight: 500; }

.q-arrow {
  font-size: 14px;
  color: #334;
  transition: all 0.2s;
  flex-shrink: 0;
}
.quality-btn:hover .q-arrow { color: #ffcc00; transform: translateX(3px); }

/* Quality color variants */
.quality-btn.sd  { border-color: #1e2a3a; }
.quality-btn.hd  { border-color: rgba(255,204,0,0.18); }
.quality-btn.hd  .q-badge { background: rgba(255,204,0,0.08); }
.quality-btn.fhd { border-color: rgba(33,150,243,0.2); }
.quality-btn.fhd .q-badge { background: rgba(33,150,243,0.08); }
.quality-btn.uhd { border-color: rgba(156,39,176,0.22); }
.quality-btn.uhd .q-badge { background: rgba(156,39,176,0.1); }

/* Back link */
.back-link {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  color: #334;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: color 0.2s;
  text-decoration: none;
  padding: 6px;
  border-radius: 8px;
}
.back-link:hover { color: #ffcc00; }

/* Loading */
.loading {
  text-align: center;
  padding: 32px 22px;
  color: #445;
  font-size: 12px;
  font-weight: 600;
}
.spinner {
  width: 32px;
  height: 32px;
  border: 2px solid #1a2540;
  border-top-color: #ffcc00;
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  margin: 0 auto 14px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Error */
.error-box {
  padding: 22px;
  text-align: center;
  color: #556;
  font-size: 13px;
}
.error-icon { font-size: 38px; margin-bottom: 12px; }
.error-title { font-size: 15px; font-weight: 700; color: #778; margin-bottom: 6px; }
.error-sub { font-size: 12px; color: #445; margin-bottom: 16px; line-height: 1.6; }

/* Footer note */
.card-footer {
  padding: 12px 22px 16px;
  border-top: 1px solid #0e1828;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  font-size: 10px;
  color: #223;
  font-weight: 600;
  letter-spacing: 0.3px;
}
.card-footer span { color: #ffcc0044; }

/* Fade-in animation */
@keyframes fadeUp {
  from { opacity:0; transform:translateY(16px); }
  to   { opacity:1; transform:translateY(0); }
}
.card { animation: fadeUp 0.35s cubic-bezier(0.2,0.8,0.2,1) both; }
.logo { animation: fadeUp 0.3s ease both; }
</style>
</head>
<body>

<div class="logo"><span>Knight</span><b>Wolf</b></div>
<div class="logo-sub">Secure Download</div>

<div class="card">

  <!-- LOADING -->
  <div id="loading" class="loading">
    <div class="spinner"></div>
    Fetching download links…
  </div>

  <!-- CONTENT -->
  <div id="content" style="display:none">
    <div class="card-header">
      <div class="episode-tag" id="epTag">Download</div>
      <div class="host-name" id="hostName">Select Quality</div>
      <div class="host-meta" id="hostMeta">Choose your preferred quality</div>
    </div>

    <div class="quality-wrap">
      <div class="section-title">Available Qualities</div>
      <div class="quality-grid" id="qualityGrid"></div>
      <a class="back-link" href="javascript:history.back()">← Go Back</a>
    </div>

    <div class="card-footer">
      <span>⚔</span> Powered by KnightWolf
    </div>
  </div>

  <!-- ERROR -->
  <div id="errorBox" style="display:none">
    <div class="error-box">
      <div class="error-icon">⚠️</div>
      <div class="error-title">Links Not Found</div>
      <div class="error-sub">Download links are unavailable.<br>Please go back and try again.</div>
      <a class="back-link" href="javascript:history.back()">← Go Back</a>
    </div>
    <div class="card-footer"><span>⚔</span> Powered by KnightWolf</div>
  </div>

</div>

<script>
const BASE    = "https://animehunt-backend.animehunt715.workers.dev"
const params  = new URLSearchParams(location.search)
const hostId  = params.get("host_id")
const animeQ  = params.get("anime")   || ""
const seasonQ = params.get("season")  || ""
const epQ     = params.get("episode") || ""

const D = id => document.getElementById(id)

const QUALITY_META = {
  "480p":  { icon:"📱", label:"480p SD",   cls:"sd",  note:"Smaller file size" },
  "720p":  { icon:"📺", label:"720p HD",   cls:"hd",  note:"Recommended" },
  "1080p": { icon:"🖥", label:"1080p FHD", cls:"fhd", note:"Full HD quality" },
  "4K":    { icon:"🌟", label:"4K UHD",    cls:"uhd", note:"Ultra HD" }
}

async function loadLinks() {
  if (!hostId) { showError(); return }

  try {
    const res  = await fetch(`${BASE}/api/knight-data?host_id=${encodeURIComponent(hostId)}`)
    const json = await res.json()

    if (!res.ok || !json.success) { showError(); return }

    const { host, links } = json.data || {}
    if (!links?.length) { showError(); return }

    D("hostName").textContent = host?.name || "Download"
    D("hostMeta").textContent = `${links.length} ${links.length === 1 ? "quality" : "qualities"} available`

    if (animeQ || epQ) {
      let tag = ""
      if (animeQ)  tag += animeQ
      if (seasonQ) tag += ` · S${seasonQ}`
      if (epQ)     tag += ` EP${epQ}`
      D("epTag").textContent = tag.trim() || "Download"
    }

    const grid = D("qualityGrid")
    grid.innerHTML = ""

    for (const link of links) {
      const meta = QUALITY_META[link.quality] || {
        icon:"📥", label: link.quality || "Download", cls:"sd", note:""
      }
      const href = `${BASE}/api/download-final?host_id=${encodeURIComponent(hostId)}&quality=${encodeURIComponent(link.quality || "")}`

      const a = document.createElement("a")
      a.className = `quality-btn ${meta.cls}`
      a.href = href
      a.innerHTML = `
        <div class="q-left">
          <div class="q-badge">${meta.icon}</div>
          <div class="q-text">
            <span class="q-label">${meta.label}</span>
            ${meta.note ? `<span class="q-note">${meta.note}</span>` : ""}
          </div>
        </div>
        <span class="q-arrow">›</span>
      `
      grid.appendChild(a)
    }

    D("loading").style.display = "none"
    D("content").style.display = "block"

  } catch (err) {
    console.error("knight error:", err)
    showError()
  }
}

function showError() {
  D("loading").style.display  = "none"
  D("errorBox").style.display = "block"
}

loadLinks()
</script>
</body>
</html>
