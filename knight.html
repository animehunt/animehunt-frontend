<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Select Quality — KnightWolf</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#060a14;color:#fff;font-family:system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.wrap{max-width:480px;width:100%;text-align:center}
.logo{font-size:22px;font-weight:800;margin-bottom:24px}.logo b{color:#ffcc00}

/* CARD */
.card{background:#0d1322;border:1px solid #1a2035;border-radius:20px;padding:28px 24px}
.knight-header{margin-bottom:22px}
.knight-icon{font-size:48px;margin-bottom:10px}
.knight-title{font-size:20px;font-weight:800}
.knight-sub{font-size:12.5px;color:#556;margin-top:6px;line-height:1.6}

/* EPISODE INFO */
.ep-info{background:#070b16;border:1px solid #1a2035;border-radius:10px;padding:11px 14px;margin-bottom:20px;display:flex;align-items:center;gap:10px}
.ep-info .poster{width:38px;height:52px;border-radius:5px;object-fit:cover;background:#1a2035;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:18px;overflow:hidden}
.ep-info .poster img{width:100%;height:100%;object-fit:cover}
.ep-info .details{text-align:left}
.ep-info .anime-name{font-size:13px;font-weight:700}
.ep-info .ep-meta{font-size:11px;color:#555;margin-top:3px}

/* QUALITY BUTTONS */
.quality-list{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.quality-btn{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px;background:#0b0f1a;border:1px solid #1a2035;
  border-radius:12px;cursor:pointer;text-decoration:none;
  transition:all .25s;color:#fff
}
.quality-btn:hover{border-color:#ffcc00;background:#111827;transform:translateX(4px)}
.quality-btn.recommended{border-color:#ffcc0044;background:#0d1020}
.quality-btn.recommended:hover{border-color:#ffcc00}

.qb-left{display:flex;align-items:center;gap:13px}
.qb-icon{font-size:20px;width:32px;text-align:center}
.qb-quality{font-size:17px;font-weight:800;line-height:1}
.qb-details{font-size:11px;color:#555;margin-top:3px}
.qb-right{display:flex;align-items:center;gap:8px}
.rec-badge{font-size:10px;padding:3px 8px;border-radius:10px;background:#1a1500;color:#ffcc00;border:1px solid #ffcc0033;font-weight:700}
.size-badge{font-size:10px;padding:3px 8px;border-radius:10px;background:#1a2035;color:#777}
.qb-arrow{color:#555;font-size:14px;transition:.2s}
.quality-btn:hover .qb-arrow{color:#ffcc00}

/* QUALITY RESOLUTION MAP */
.res-4K .qb-quality{color:#ce93d8}
.res-1080p .qb-quality{color:#64b5f6}
.res-720p .qb-quality{color:#4caf50}
.res-480p .qb-quality{color:#ffcc00}
.res-360p .qb-quality{color:#aaa}

/* LOADING */
.loading-state{padding:40px;color:#556}
.spinner{display:inline-block;width:28px;height:28px;border:3px solid #1a2035;border-top-color:#ffcc00;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.error-box{background:#1a0808;border:1px solid #f4433633;border-radius:10px;padding:13px 15px;color:#f44336;font-size:12.5px;text-align:left}

/* BACK */
.btn-back{
  display:inline-flex;align-items:center;justify-content:center;
  width:100%;padding:11px;margin-top:6px;
  background:transparent;border:1px solid #1a2035;color:#556;
  border-radius:11px;font-size:12.5px;cursor:pointer;text-decoration:none;transition:.2s
}
.btn-back:hover{border-color:#334;color:#aaa}

/* NOTICE */
.notice{background:#070b16;border:1px solid #1a2035;border-radius:8px;padding:9px 12px;font-size:11px;color:#556;text-align:left;margin-bottom:14px;line-height:1.6}

/* FOOTER */
.card-footer{margin-top:16px;font-size:11px;color:#334;line-height:1.7}
</style>
</head>
<body data-page="knight">
<div class="wrap">
  <div class="logo"><span>Knight</span><b>Wolf</b></div>

  <div class="card">
    <div class="knight-header">
      <div class="knight-icon">⚔️</div>
      <div class="knight-title">Select Download Quality</div>
      <div class="knight-sub">Choose your preferred quality below</div>
    </div>

    <!-- EPISODE INFO -->
    <div class="ep-info" id="epInfo" style="display:none">
      <div class="poster" id="posterEl">🎬</div>
      <div class="details">
        <div class="anime-name" id="animeName">Loading...</div>
        <div class="ep-meta"   id="epMeta"></div>
      </div>
    </div>

    <div class="notice">💡 Higher quality = larger file size. 720p is recommended for most devices.</div>

    <!-- QUALITY LIST -->
    <div class="quality-list" id="qualityList">
      <div class="loading-state"><div class="spinner"></div><br><br>Loading qualities...</div>
    </div>

    <a class="btn-back" href="javascript:history.back()">← Back</a>
    <div class="card-footer">Downloaded from KnightWolf · Click download and save the file</div>
  </div>
</div>

<script>
const BASE   = 'https://animehunt-backend.animehunt715.workers.dev'
const params = new URLSearchParams(location.search)

const hostId  = params.get('host_id')
const anime   = params.get('anime')
const season  = params.get('season')
const episode = params.get('episode')

/* ── QUALITY META ── */
const QUALITY_META = {
  '4K':    { icon: '💎', details: '3840×2160 · Ultra HD',   res: 'res-4K',    size: '~8-15GB',  recommended: false },
  '1080p': { icon: '🎬', details: '1920×1080 · Full HD',    res: 'res-1080p', size: '~1.5-4GB', recommended: false },
  '720p':  { icon: '📺', details: '1280×720  · HD Ready',   res: 'res-720p',  size: '~700MB-1.5GB', recommended: true },
  '480p':  { icon: '📱', details: '854×480   · Standard',   res: 'res-480p',  size: '~300-600MB', recommended: false },
  '360p':  { icon: '⚡', details: '640×360   · Low Quality', res: 'res-360p',  size: '~150-300MB', recommended: false }
}

function esc(s) { return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') }

async function track(event_type, extra = {}) {
  try {
    await fetch(`${BASE}/api/analytics`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ event_type, event_data: JSON.stringify({ host_id: hostId, anime, season, episode, ...extra }) })
    })
  } catch {}
}

async function loadKnightData() {
  const list = document.getElementById('qualityList')
  try {
    const r = await fetch(`${BASE}/api/knight-data?host_id=${encodeURIComponent(hostId || '')}`)
    const j = await r.json()
    if (!j.success || !j.data?.qualities?.length) {
      list.innerHTML = `<div class="error-box">⚠️ No quality links found. Please go back and try another host.</div>`
      return
    }
    renderQualities(j.data)
    loadAnimeInfo(j.data)
    track('knight_page_view')
  } catch {
    list.innerHTML = `<div class="error-box">⚠️ Failed to load. Please try again.</div>`
  }
}

function loadAnimeInfo(data) {
  if (!anime && !data.anime_title) return
  const epInfo   = document.getElementById('epInfo')
  const nameEl   = document.getElementById('animeName')
  const metaEl   = document.getElementById('epMeta')
  const posterEl = document.getElementById('posterEl')

  nameEl.textContent = data.anime_title || decodeURIComponent(anime || '')
  const parts = []
  if (season)  parts.push(`Season ${season}`)
  if (episode) parts.push(`Episode ${episode}`)
  if (data.episode_title) parts.push(data.episode_title)
  metaEl.textContent = parts.join(' · ')

  if (data.poster) {
    const img = document.createElement('img')
    img.src = data.poster; img.alt = 'poster'
    posterEl.textContent = ''
    posterEl.appendChild(img)
  }
  epInfo.style.display = 'flex'
}

function renderQualities(data) {
  const list = document.getElementById('qualityList')
  const qs   = data.qualities || []
  list.innerHTML = ''

  const sorted = [...qs].sort((a, b) => {
    const order = ['4K','1080p','720p','480p','360p']
    return order.indexOf(a.quality) - order.indexOf(b.quality)
  })

  sorted.forEach((q, idx) => {
    const meta    = QUALITY_META[q.quality] || { icon: '📥', details: 'Download', res: '', size: '', recommended: false }
    const isRec   = meta.recommended
    const btn     = document.createElement('a')
    btn.className = `quality-btn ${meta.res}${isRec ? ' recommended' : ''}`
    btn.href      = '#'

    btn.innerHTML = `
      <div class="qb-left">
        <span class="qb-icon">${meta.icon}</span>
        <div>
          <div class="qb-quality">${esc(q.quality)}</div>
          <div class="qb-details">${meta.details}</div>
        </div>
      </div>
      <div class="qb-right">
        ${isRec ? '<span class="rec-badge">⭐ Recommended</span>' : ''}
        <span class="size-badge">${meta.size}</span>
        <span class="qb-arrow">›</span>
      </div>`

    btn.addEventListener('click', (e) => {
      e.preventDefault()
      track('knight_download', { quality: q.quality })
      window.location.href = q.link
    })
    list.appendChild(btn)
  })
}

loadKnightData()
</script>
<script type="module" src="js/script.js"></script>
</body>
</html>
